name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Basic route checks
        run: |
          npm run start &
          SERVER_PID=$!
          # Wait for the server to accept connections (up to ~30s)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:3000/home"; then
              break
            fi
            sleep 1
          done
          ROUTES=("/home" "/planner" "/bookings" "/posts" "/templates" "/themes" "/eventrecomm" "/themerecomm" "/venuerecomm")
          FAILED=0
          for path in "${ROUTES[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000${path}")
            if [[ "$code" != 2* && "$code" != 3* ]]; then
              echo "::error::Route $path returned $code"
              FAILED=1
            fi
          done
          kill $SERVER_PID || true
          exit $FAILED
