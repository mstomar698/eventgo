name: Bug report
description: Report something that isn't working
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill out the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click X on the planner, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '/planner'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - api
        - auth
        - planner
        - ai
        - templates
        - bookings
        - venues
        - ui
        - ci
        - other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, deployment (local / eventgo.vercel.app)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      render: shell
