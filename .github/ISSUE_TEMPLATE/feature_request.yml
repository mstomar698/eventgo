name: Feature request
description: Suggest a new feature or enhancement
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - auth
        - planner
        - ai
        - templates
        - bookings
        - venues
        - ui
        - ci
        - oss
        - other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
